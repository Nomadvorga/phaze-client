
plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // Modrinth Maven - hosts Sodium jars for compile-time references.
    // We only need Sodium's public renderer classes at compile time
    // (DefaultChunkRenderer, RenderRegion, ChunkShaderInterface) for
    // the optional Sodium-compat mixin; no Sodium code is bundled.
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/phaze.accesswidener")
}

configurations {
    libImpl
    modImpl
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Sodium 0.6.13+mc1.21.4 - compile-only, no runtime bundling.
    // Pulled in so the optional Sodium-compat mixin
    // (sodium.DefaultChunkRendererChunkAnimatorMixin) can compile
    // against Sodium's public renderer classes. At runtime the mixin
    // is only loaded when FabricLoader reports Sodium as present
    // (see PhazeMixinPlugin), so users without Sodium are unaffected.
    modCompileOnly "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"

    // Iris 1.8.8+mc1.21.4 - compile-only via local jar in
    // libs-compileonly/. Modrinth's maven version slug for Iris is
    // unstable across uploads, so the local file is the most
    // reliable way to satisfy loom's @Mixin(targets = "...") class
    // existence check at compile time. The jar is NEVER bundled
    // into the output (compileOnly, not implementation, and the
    // libImpl bundling fileTree below excludes this directory).
    // At runtime the iris.* mixin is gated by
    // FabricLoader.isModLoaded("iris") via PhazeMixinPlugin, so
    // users without Iris are unaffected.
    compileOnly fileTree(dir: 'libs-compileonly', include: ['*.jar'])

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    libImpl fileTree(dir: 'libs', include: ['*.jar'])

    configurations.libImpl.dependencies.each {
        implementation(it)
    }

    configurations.modImpl.dependencies.each {
        modImplementation(it)
        include(it)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.register('verifySignedModuleManifest', Exec) {
    group = 'verification'
    description = 'Verifies the signed module catalog and checks it matches Main.java'
    inputs.file('src/main/resources/phaze/module-manifest.json')
    inputs.file('src/main/resources/phaze/module-manifest.sig')
    inputs.file('security/manifest-ed25519-public.pem')
    inputs.file('src/main/java/vorga/phazeclient/core/Main.java')
    inputs.dir('src/main/java/vorga/phazeclient/implement/features/modules')
    commandLine 'node', 'scripts/module-manifest.mjs', 'verify'
}

tasks.named('processResources') {
    dependsOn tasks.named('verifySignedModuleManifest')
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}


jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    from {
        configurations.libImpl.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from {
        configurations.runtimeClasspath.findAll { it.name.startsWith('vlcj') || it.name.startsWith('jna') }.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

// Cutebow granted permission to bundle this exact Custom Glint 1.21.4
// implementation. The classes are already remapped for the runtime jar.
def licensedCustomGlintJar = file('C:/Users/PC/Downloads/Telegram Desktop/PhazeClient-1.0 (2).jar')
def licensedCustomGlintOverlay = layout.buildDirectory.dir('tmp/licensed-custom-glint')
tasks.register('overlayLicensedCustomGlint') {
    dependsOn tasks.named('remapJar')
    inputs.file(licensedCustomGlintJar)
    outputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    doLast {
        copy {
            from zipTree(licensedCustomGlintJar)
            into licensedCustomGlintOverlay
            include 'vorga/phazeclient/implement/customglint/**'
            include 'vorga/phazeclient/implement/features/modules/other/CustomGlint.class'
            include 'assets/phaze/shaders/core/glint_*_bloom.*'
            include 'assets/phaze/shaders/core/glint_bloom_composite.*'
            include 'assets/phaze/textures/misc/glints/**'
            include 'assets/phaze/textures/modules/custom_glint.png'
        }
        exec {
            workingDir licensedCustomGlintOverlay.get().asFile
            commandLine 'jar', 'uf', tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath, '-C', '.', '.'
        }
    }
}
tasks.named('remapJar') {
    finalizedBy tasks.named('overlayLicensedCustomGlint')
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {}
}
