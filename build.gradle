
plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // Modrinth Maven - hosts Sodium jars for compile-time references.
    // We only need Sodium's public renderer classes at compile time
    // (DefaultChunkRenderer, RenderRegion, ChunkShaderInterface) for
    // the optional Sodium-compat mixin; no Sodium code is bundled.
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/phaze.accesswidener")
}

configurations {
    libImpl
    modImpl
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Sodium 0.6.13+mc1.21.4 - compile-only, no runtime bundling.
    // Pulled in so the optional Sodium-compat mixin
    // (sodium.DefaultChunkRendererChunkAnimatorMixin) can compile
    // against Sodium's public renderer classes. At runtime the mixin
    // is only loaded when FabricLoader reports Sodium as present
    // (see PhazeMixinPlugin), so users without Sodium are unaffected.
    modCompileOnly "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"

    // Iris 1.8.8+mc1.21.4 - compile-only via local jar in
    // libs-compileonly/. Modrinth's maven version slug for Iris is
    // unstable across uploads, so the local file is the most
    // reliable way to satisfy loom's @Mixin(targets = "...") class
    // existence check at compile time. The jar is NEVER bundled
    // into the output (compileOnly, not implementation, and the
    // libImpl bundling fileTree below excludes this directory).
    // At runtime the iris.* mixin is gated by
    // FabricLoader.isModLoaded("iris") via PhazeMixinPlugin, so
    // users without Iris are unaffected.
    compileOnly fileTree(dir: 'libs-compileonly', include: ['*.jar'])

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    libImpl fileTree(dir: 'libs', include: ['*.jar'])

    configurations.libImpl.dependencies.each {
        implementation(it)
    }

    configurations.modImpl.dependencies.each {
        modImplementation(it)
        include(it)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.register('verifySignedModuleManifest', Exec) {
    group = 'verification'
    description = 'Verifies the signed module catalog and checks it matches Main.java'
    inputs.file('src/main/resources/phaze/module-manifest.json')
    inputs.file('src/main/resources/phaze/module-manifest.sig')
    inputs.file('security/manifest-ed25519-public.pem')
    inputs.file('src/main/java/vorga/phazeclient/core/Main.java')
    inputs.dir('src/main/java/vorga/phazeclient/implement/features/modules')
    commandLine 'node', 'scripts/module-manifest.mjs', 'verify'
}

tasks.named('processResources') {
    dependsOn tasks.named('verifySignedModuleManifest')
}

sourceSets.test.java.srcDir('scripts')

// Dedicated GL runs select their fixtures without changing the normal client suite.
tasks.named('processTestResources') {
    def blurOnly = project.hasProperty('hudBlurOnly')
    def textureFilterOnly = project.hasProperty('textureFilterOnly')
    def hudEditorOnly = project.hasProperty('hudEditorOnly')
    def bossBarOnly = project.hasProperty('bossBarOnly')
    def guiBenchOnly = project.hasProperty('guiBenchOnly')
    def guiBenchWorld = project.hasProperty('guiBenchWorld')
    def paperDollOnly = project.hasProperty('paperDollOnly')
    inputs.property 'guiBenchWorld', guiBenchWorld
    inputs.property 'paperDollOnly', paperDollOnly
    inputs.property 'hudBlurOnly', blurOnly
    inputs.property 'textureFilterOnly', textureFilterOnly
    inputs.property 'hudEditorOnly', hudEditorOnly
    inputs.property 'bossBarOnly', bossBarOnly
    inputs.property 'guiBenchOnly', guiBenchOnly
    if (blurOnly || textureFilterOnly || hudEditorOnly || bossBarOnly || guiBenchOnly || paperDollOnly) {
        def selected = guiBenchOnly ? [guiBenchWorld ? 'GuiWorldBenchmarkClientTest' : 'GuiRenderBenchmarkClientTest']
                : paperDollOnly ? ['PaperDollClientTest']
                : hudEditorOnly
                ? ['HudEditorClientTest', 'HudCachedReplayClientTest', 'RenderSafetyClientTest']
                : bossBarOnly ? ['BossBarClientTest']
                : textureFilterOnly ? ['TextureFilteringClientTest', 'LoadingOverlayClientTest', 'RenderSafetyClientTest']
                : ['HudCachedReplayClientTest', 'RenderSafetyClientTest', 'HudBlurClientTest']
        filesMatching('fabric.mod.json') {
            filter { String line ->
                if (line.contains('"vorga.')) {
                    if (!selected.any { line.contains(it) }) return null
                    if (line.contains(selected.last())) return line.replaceFirst(/,\s*$/, '')
                }
                return line
            }
        }
    } else {
        // Benchmarks only run through -PguiBenchOnly; they are listed before the last entry.
        filesMatching('fabric.mod.json') {
            filter { String line -> line.contains('BenchmarkClientTest') ? null : line }
        }
    }
}

tasks.register('verifyPackPreviewAssets', JavaExec) {
    group = 'verification'
    description = 'Offline pack scanning, search, cycling, composition and asynchronous preview checks'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.implement.features.modules.other.PackPreviewChecks'
}

tasks.register('verifyMenuLocalization', JavaExec) {
    group = 'verification'
    description = 'Verifies English module titles/tabs and localized settings without changing user configs'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.implement.features.modules.other.MenuLocalizationChecks'
}

tasks.register('verifyMessenger', JavaExec) {
    group = 'verification'
    description = 'Friend requests and chat error lines against a local fake chat API'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.implement.menu.components.implement.other.MessengerChecks'
    // The device key and client id are written here, never into the player's real files.
    def sandbox = layout.buildDirectory.dir('messenger-check').get().asFile
    workingDir = sandbox
    environment 'APPDATA', sandbox.absolutePath
    doFirst { sandbox.mkdirs() }
}
tasks.named('check') { dependsOn 'verifyMessenger' }

[
    verifyGlintSettings: 'vorga.phazeclient.implement.features.modules.other.GlintSettingsChecks',
    verifyHandAnimationTransforms: 'vorga.phazeclient.implement.features.modules.other.HandAnimationTransformChecks',
    verifyProjectileLaunch: 'vorga.phazeclient.implement.features.modules.other.ProjectileLaunchChecks',
    verifyProjectileFlight: 'vorga.phazeclient.implement.features.modules.other.ProjectileFlightChecks',
    verifyPredictionRendering: 'vorga.phazeclient.implement.features.modules.other.PredictionRenderingChecks',
    verifyPredictionBatch: 'vorga.phazeclient.implement.features.modules.other.PredictionBatchChecks',
    verifyProjectileQueries: 'vorga.phazeclient.implement.features.modules.other.ProjectileQueryChecks',
    verifyWorldOverlays: 'vorga.phazeclient.api.system.render.WorldOverlayChecks',
    verifyChunkAnimation: 'vorga.phazeclient.implement.features.modules.other.ChunkAnimatorChecks',
    verifyHudCompatibility: 'vorga.phazeclient.implement.features.modules.hud.HudCompatibilityChecks',
    verifyBossBar: 'vorga.phazeclient.implement.features.modules.hud.BossBarChecks',
    verifyGuiInteractions: 'vorga.phazeclient.implement.menu.components.implement.settings.GuiInteractionChecks',
    verifyGlintTextureClock: 'vorga.phazeclient.base.util.render.GlintTextureClockChecks',
    verifyLowHealthSettings: 'vorga.phazeclient.implement.features.modules.other.LowHealthSettingsChecks',
    verifySettingLabels: 'vorga.phazeclient.implement.menu.components.implement.settings.SettingLabelChecks',
    verifyGuiFonts: 'vorga.phazeclient.implement.menu.font.GuiFontChecks',
    verifyTextureFiltering: 'vorga.phazeclient.implement.menu.TextureFilteringChecks',
    verifyRenderLifecycle: 'vorga.phazeclient.api.system.render.RenderLifecycleChecks',
    verifyConfigPersistence: 'vorga.phazeclient.implement.config.ConfigPersistenceChecks',
    verifyHudRenderSafety: 'vorga.phazeclient.api.system.hud.HudRenderSafetyChecks',
    verifyHudBlurOptimization: 'vorga.phazeclient.api.system.hud.HudBlurOptimizationChecks',
    verifyHudEditorCache: 'vorga.phazeclient.api.system.hud.HudEditorCacheChecks',
    verifyHotbarPerformance: 'vorga.phazeclient.api.system.hud.HotbarPerformanceChecks',
    verifyHitRangeGeometry: 'vorga.phazeclient.implement.hitrange.HitRangeGeometryChecks'
].each { taskName, testMain ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = testMain
    }
    tasks.named('check') { dependsOn taskName }
}

tasks.named('verifyProjectileQueries', JavaExec) {
    // Vanilla registries need the same package-access repair Fabric performs after Yarn remapping.
    mainClass = 'vorga.phazeclient.test.HeadlessMinecraftChecks'
    args 'vorga.phazeclient.implement.features.modules.other.ProjectileQueryChecks'
}

tasks.named('verifyChunkAnimation', JavaExec) {
    // ChunkPos initializes vanilla chunk-generation registries; use Fabric's package-access repair.
    mainClass = 'vorga.phazeclient.test.HeadlessMinecraftChecks'
    args 'vorga.phazeclient.implement.features.modules.other.ChunkAnimatorChecks'
}

tasks.named('verifyConfigPersistence', JavaExec) {
    mainClass = 'vorga.phazeclient.test.HeadlessMinecraftChecks'
    args 'vorga.phazeclient.implement.config.ConfigPersistenceChecks'
}

tasks.register('benchmarkPredictionCpu', JavaExec) {
    group = 'verification'
    description = 'Optional CPU-only prediction comparison; not an in-game FPS/GPU benchmark'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.test.HeadlessMinecraftChecks'
    args 'vorga.phazeclient.implement.features.modules.other.PredictionPerformanceBench'
    if (project.hasProperty('predictionBaseline')) {
        systemProperty 'phaze.prediction.baseline', project.property('predictionBaseline')
    }
}

tasks.register('benchmarkHitRangeCpu', JavaExec) {
    group = 'verification'
    description = 'Optional CPU-only Hit Range geometry comparison; no in-game FPS/GPU claim'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vorga.phazeclient.implement.hitrange.HitRangePerformanceBench'
}

tasks.named('check') {
    dependsOn tasks.named('verifyPackPreviewAssets')
    dependsOn tasks.named('verifyMenuLocalization')
}

// Optional graphical smoke run. Its packs, options and configs stay under build/.
loom {
    mods {
        phazePreviewTests {
            sourceSet sourceSets.test
        }
    }
    runs {
        packPreviewSmoke {
            client()
            source sourceSets.test
            runDir 'build/pack-preview-client-test'
            vmArg '-Dfabric.client.gametest'
        }
        hudBlurSmoke {
            client()
            source sourceSets.test
            runDir 'build/hud-blur-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            if (project.hasProperty('hudBlurBenchmark')) vmArg '-Dphaze.hudBlur.benchmark=true'
        }
        textureFilterSmoke {
            client()
            source sourceSets.test
            runDir 'build/texture-filter-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
        }
        hudEditorSmoke {
            client()
            source sourceSets.test
            runDir 'build/hud-editor-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
        }
        bossBarSmoke {
            client()
            source sourceSets.test
            runDir 'build/boss-bar-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
        }
        guiBench {
            client()
            source sourceSets.test
            runDir 'build/gui-bench-client-test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phaze_preview_tests'
            if (project.hasProperty('guiBenchProfile')) {
                vmArg '-Dphaze.guiBench.profile=true'
                if (project.hasProperty('guiBenchCosmetics')) vmArg '-Dphaze.guiBench.cosmetics=true'
                vmArg "-XX:StartFlightRecording=filename=gui-bench.jfr,settings=${project.findProperty('guiBenchJfc') ?: 'profile'}"
            }
        }
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}


jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    from {
        configurations.libImpl.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from {
        configurations.runtimeClasspath.findAll { it.name.startsWith('vlcj') || it.name.startsWith('jna') }.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {}
}
