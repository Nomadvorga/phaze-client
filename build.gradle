
plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // Modrinth Maven - hosts Sodium jars for compile-time references.
    // We only need Sodium's public renderer classes at compile time
    // (DefaultChunkRenderer, RenderRegion, ChunkShaderInterface) for
    // the optional Sodium-compat mixin; no Sodium code is bundled.
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/phaze.accesswidener")
}

configurations {
    libImpl
    modImpl
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Sodium 0.6.13+mc1.21.4 - compile-only, no runtime bundling.
    // Pulled in so the optional Sodium-compat mixin
    // (sodium.DefaultChunkRendererChunkAnimatorMixin) can compile
    // against Sodium's public renderer classes. At runtime the mixin
    // is only loaded when FabricLoader reports Sodium as present
    // (see PhazeMixinPlugin), so users without Sodium are unaffected.
    modCompileOnly "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"

    // Optional compatibility targets. These exact public Modrinth version IDs
    // are compile-only and are never bundled into the published mod jar.
    modCompileOnly "maven.modrinth:iris:Ca054sTe"
    modCompileOnly "maven.modrinth:reeses-sodium-options:KoUrx3jJ"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Clipboard image support. The exact Maven Central artifact and its
    // transitive native-utils dependency are documented in BINARY_PROVENANCE.md.
    libImpl 'io.github.imurx:arboard:1.1.2'

    configurations.libImpl.dependencies.each {
        implementation(it)
    }

    configurations.modImpl.dependencies.each {
        modImplementation(it)
        include(it)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}


jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    from {
        configurations.libImpl.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {}
}
