
plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // Modrinth Maven - hosts Sodium jars for compile-time references.
    // We only need Sodium's public renderer classes at compile time
    // for the optional Sodium-compat mixin; no Sodium code is bundled.
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/phaze.accesswidener")
}

configurations {
    libImpl
    modImpl
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Sodium - compile-only, no runtime bundling. Pulled in so the
    // optional Sodium-compat mixins can compile against Sodium's public
    // renderer classes. At runtime they are only loaded when FabricLoader
    // reports Sodium as present (see PhazeMixinPlugin), so users without
    // Sodium are unaffected.
    //
    // NOTE (1.21.11 port): the Sodium compat mixins are currently staged
    // out under compat-staging/ - Sodium's chunk renderer internals moved
    // substantially between 0.6.x (1.21.4) and 0.8.x (1.21.11).
    //
    // The dependency is commented out rather than deleted: Sodium
    // 0.8.13 is published with Loom 1.16.1 metadata, so re-enabling it
    // also requires bumping the fabric-loom plugin above to >= 1.16.1.
    // Nothing currently compiled needs Sodium classes, so it stays off
    // until the compat mixins come back.
    // modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    libImpl fileTree(dir: 'libs', include: ['*.jar'])

    configurations.libImpl.dependencies.each {
        implementation(it)
    }

    configurations.modImpl.dependencies.each {
        modImplementation(it)
        include(it)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    from {
        configurations.libImpl.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

// NOTE (1.21.11 port): the licensed Custom Glint overlay from the 1.21.4
// build is intentionally NOT carried over - Custom Glint is out of scope
// for this port.

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {}
}
