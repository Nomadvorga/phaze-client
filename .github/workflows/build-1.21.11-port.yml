name: Build 1.21.11 port

# CI build for the 1.21.11 port branch. The upstream "Build verifiable release"
# workflow targets master/tags and builds the 1.21.4 sources, so this one exists
# to compile the port before it is merged.
#
# It runs on Windows on purpose: the wrapper script committed to the repo is
# gradlew.bat, and build.gradle locates the optional Sodium integration target
# through the local PrismLauncher instance folder (%APPDATA%). Both are
# reproduced by the prepare step below.

on:
  pull_request:
    branches: ['1.21.11-v1.1']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-1.21.11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore compile-only jars
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-deps
          key: phaze-ci-deps-sodium-0.8.14-mc1.21.11-arboard-1.1.2-jna-5.14.0-v1

      # build.gradle expects two artifacts that are intentionally not in git:
      #   * Sodium 0.8.14+mc1.21.11 as a plain compileOnly fileTree entry,
      #   * the bundled helper jars in libs/ (arboard + JNA).
      # Recreate both from public sources so a clean checkout can compile.
      - name: Prepare compile-only dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Join-Path $env:RUNNER_TEMP 'ci-deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          function Get-Jar {
            param([string]$Name, [string[]]$Urls)
            $target = Join-Path $deps $Name
            if (Test-Path $target) {
              Write-Host "cached: $Name ($((Get-Item $target).Length) bytes)"
              return $target
            }
            foreach ($url in $Urls) {
              Write-Host "download: $Name <- $url"
              $tmp = "$target.part"
              try {
                Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing -TimeoutSec 180
              } catch {
                Write-Host "  failed: $($_.Exception.Message)"
                continue
              }
              $bytes = [System.IO.File]::ReadAllBytes($tmp)
              if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4B) {
                Write-Host "  failed: response is not a jar archive"
                Remove-Item $tmp -Force
                continue
              }
              Move-Item $tmp $target -Force
              Write-Host "  ok: $($bytes.Length) bytes"
              return $target
            }
            throw "Could not download $Name. Tried: $($Urls -join ', ')"
          }

          # --- Sodium (compile-only renderer integration target) -------------
          $sodium = 'sodium-fabric-0.8.14+mc1.21.11.jar'
          if (-not (Test-Path (Join-Path $deps $sodium))) {
            $headers = @{ 'User-Agent' = 'phaze-client-ci (github actions)' }
            $versions = Invoke-RestMethod `
              -Uri 'https://api.modrinth.com/v2/project/sodium/version' `
              -Headers $headers -TimeoutSec 180
            $candidates = $versions |
              Where-Object { $_.loaders -contains 'fabric' -and $_.game_versions -contains '1.21.11' }
            $pick = $candidates |
              Where-Object { $_.version_number -eq 'mc1.21.11-0.8.14-fabric' } |
              Select-Object -First 1
            if (-not $pick) { $pick = $candidates | Select-Object -First 1 }
            if (-not $pick) { throw 'No Sodium fabric build for 1.21.11 found on Modrinth' }
            Write-Host "Sodium version: $($pick.version_number)"
            Get-Jar -Name $sodium -Urls @($pick.files[0].url) | Out-Null
          }

          # --- libs/: clipboard (arboard) + native calls (JNA) ---------------
          Get-Jar -Name 'arboard-1.1.2.jar' -Urls @(
            'https://repo1.maven.org/maven2/io/github/imurx/arboard/1.1.2/arboard-1.1.2.jar',
            'https://jitpack.io/io/github/imurx/arboard/1.1.2/arboard-1.1.2.jar',
            'https://jitpack.io/com/github/ImUrX/arboard/1.1.2/arboard-1.1.2.jar'
          ) | Out-Null

          Get-Jar -Name 'jna-5.14.0.jar' -Urls @(
            'https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar'
          ) | Out-Null

          # build.gradle reads Sodium from the local Prism instance directory.
          $mods = Join-Path $env:APPDATA 'PrismLauncher\instances\1.21.11\minecraft\mods'
          New-Item -ItemType Directory -Force -Path $mods | Out-Null
          Copy-Item (Join-Path $deps $sodium) (Join-Path $mods $sodium) -Force

          # libs/*.jar is gitignored; the jar task bundles whatever is here.
          New-Item -ItemType Directory -Force -Path 'libs' | Out-Null
          Copy-Item (Join-Path $deps 'arboard-1.1.2.jar') 'libs\arboard-1.1.2.jar' -Force
          Copy-Item (Join-Path $deps 'jna-5.14.0.jar') 'libs\jna-5.14.0.jar' -Force

          Write-Host '--- prepared ---'
          Get-ChildItem $deps, $mods, 'libs' | Select-Object FullName, Length | Format-Table -AutoSize

      # gradle.properties pins org.gradle.java.home to a developer machine path;
      # the command line property below takes precedence and uses the CI JDK.
      - name: Build from clean source
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace "-Dorg.gradle.java.home=$env:JAVA_HOME"

      # Prints (and comments on the PR) a size breakdown of the built jar, so
      # regressions in packaged weight are visible without downloading it.
      - name: Analyze jar contents
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $jars = @(Get-ChildItem build/libs -Filter *.jar -ErrorAction SilentlyContinue)
          if ($jars.Count -eq 0) { Write-Host 'no jars to analyze'; exit 0 }

          $out = New-Object System.Collections.Generic.List[string]
          $out.Add('### Jar content breakdown (CI build)')
          $out.Add('')
          $out.Add('`build/libs` in this run:')
          $out.Add('')
          $out.Add('| file | size |')
          $out.Add('| --- | --- |')
          foreach ($f in $jars) {
            $out.Add("| $($f.Name) | $([math]::Round($f.Length / 1MB, 2)) MB |")
          }
          $out.Add('')
          $out.Add("Bundled `libs/*.jar` (unpacked straight into the mod jar):")
          $out.Add('')
          if (Test-Path libs) {
            $libs = @(Get-ChildItem libs -Filter *.jar -ErrorAction SilentlyContinue)
            if ($libs.Count -eq 0) { $out.Add('- none') }
            else {
              foreach ($l in $libs) { $out.Add("- ``$($l.Name)`` - $([math]::Round($l.Length / 1MB, 2)) MB") }
            }
          } else { $out.Add('- `libs/` missing') }
          $out.Add('')

          $main = $jars | Where-Object { $_.Name -notmatch 'sources' } | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($main.FullName)
          $groups = @{}
          $largest = New-Object System.Collections.Generic.List[object]

          foreach ($e in $zip.Entries) {
            if ($e.Length -le 0) { continue }
            $p = $e.FullName
            $parts = $p -split '/'
            $depth = [math]::Min($parts.Count - 1, 1)
            if ($parts.Count -gt 1 -and $parts[0] -eq 'assets') { $depth = [math]::Min($parts.Count - 1, 3) }
            $key = ($parts[0..$depth] -join '/')
            if (-not $groups.ContainsKey($key)) { $groups[$key] = @{ count = 0; size = 0 } }
            $groups[$key].count++
            $groups[$key].size += $e.Length
            $largest.Add([pscustomobject]@{ Path = $p; Size = $e.Length })
          }
          $zip.Dispose()

          $totalSize = ($groups.Values | Measure-Object -Property size -Sum).Sum
          $totalCount = ($groups.Values | Measure-Object -Property count -Sum).Sum
          $out.Add("`$($main.Name)` - $([math]::Round($main.Length / 1MB, 2)) MB packed, $totalCount entries, $([math]::Round($totalSize / 1MB, 2)) MB unpacked")
          $out.Add('')
          $out.Add('| group | entries | unpacked |')
          $out.Add('| --- | --- | --- |')
          foreach ($g in $groups.GetEnumerator() | Sort-Object { -$_.Value.size } | Select-Object -First 30) {
            $out.Add("| ``$($g.Key)`` | $($g.Value.count) | $([math]::Round($g.Value.size / 1MB, 3)) MB |")
          }
          $out.Add('')
          $out.Add('Largest single entries:')
          $out.Add('')
          $out.Add('| entry | size |')
          $out.Add('| --- | --- |')
          foreach ($l in ($largest | Sort-Object -Property Size -Descending | Select-Object -First 25)) {
            $out.Add("| ``$($l.Path)`` | $([math]::Round($l.Size / 1MB, 3)) MB |")
          }

          $out | Set-Content jar-inventory.md -Encoding UTF8
          $out | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host ($out -join "`n")

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:PR_NUMBER) {
            gh pr comment $env:PR_NUMBER --body-file jar-inventory.md
          }

      - name: Record release checksums
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build/libs) {
            Get-ChildItem build/libs -Filter *.jar | ForEach-Object {
              Write-Host "$($_.Name) $($_.Length) bytes"
              Get-FileHash $_.FullName -Algorithm SHA256
            }
          } else {
            Write-Host 'build/libs not produced'
          }

      - name: Upload jars and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhazeClient-1.21.11-port-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
          retention-days: 14
