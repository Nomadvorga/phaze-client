name: Build verifiable release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build from clean source
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon
      - name: Record release checksum
        shell: pwsh
        run: Get-FileHash build/libs/PhazeClient-1.0.jar -Algorithm SHA256
      - name: Upload exact Modrinth artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhazeClient-Modrinth-${{ github.sha }}
          path: build/libs/PhazeClient-1.0.jar
          if-no-files-found: error
          retention-days: 30

